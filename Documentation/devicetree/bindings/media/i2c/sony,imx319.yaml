%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx319.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX319 CMOS image sensor

maintainers:
  - Linux Media Mailing List <linux-media@vger.kernel.org>

description: |
  Sony IMX319 is a RAW Bayer image sensor with a four-lane CSI-2 interface.
  The endpoint link frequency selects a supported sensor PLL configuration.
  Power sources, voltage constraints and mounting location belong to the board.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx319
  reg:
    maxItems: 1
  clocks:
    maxItems: 1
  assigned-clocks:
    maxItems: 1
  assigned-clock-rates:
    items:
      - const: 19200000
  power-domains:
    maxItems: 1
  reset-gpios:
    maxItems: 1
  vana-supply: true
  vdig-supply: true
  vif-supply: true
  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false
    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false
        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4
          link-frequencies:
            minItems: 1
            maxItems: 2
            items:
              enum: [222000000, 482400000]
        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - vana-supply
  - vdig-supply
  - vif-supply
  - port

unevaluatedProperties: false
