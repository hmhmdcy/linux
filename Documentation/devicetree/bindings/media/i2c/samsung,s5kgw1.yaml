%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5kgw1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5KGW1 image sensor

maintainers:
  - Linux Media Mailing List <linux-media@vger.kernel.org>

description:
  Samsung S5KGW1 image sensor controlled over I2C, with a three-trio
  MIPI C-PHY interface and a 19.2 MHz input clock. Autofocus motor
  control and module calibration memories are separate devices.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5kgw1

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  reset-gpios:
    description: Active-low sensor reset.
    maxItems: 1

  power-domains:
    maxItems: 1

  vdda-supply:
    description: Analogue voltage supply.

  vddd-supply:
    description: Digital core voltage supply.

  vddio-supply:
    description: Digital I/O voltage supply.

  afvdd-supply:
    description: Optional module autofocus voltage supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            const: 1

          data-lanes:
            items:
              - const: 0
              - const: 1
              - const: 2

          link-frequencies:
            maxItems: 1

          clock-lanes: false
          lane-polarities: false

        required:
          - bus-type
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - vdda-supply
  - vddd-supply
  - vddio-supply
  - port

unevaluatedProperties: false
...
