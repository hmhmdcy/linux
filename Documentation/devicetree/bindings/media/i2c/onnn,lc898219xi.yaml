%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/onnn,lc898219xi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ON Semiconductor LC898219XI autofocus lens controller

maintainers:
  - Linux Media Mailing List <linux-media@vger.kernel.org>

description:
  LC898219XI is a closed-loop autofocus controller with a 10-bit lens
  position interface controlled over I2C. Module-specific calibration
  and focus limits belong to the camera tuning data.

properties:
  compatible:
    const: onnn,lc898219xi

  reg:
    maxItems: 1

  vdd-supply:
    description: Controller supply, between 2.6 and 3.3 volts.

required:
  - compatible
  - reg
  - vdd-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        lens@72 {
            compatible = "onnn,lc898219xi";
            reg = <0x72>;
            vdd-supply = <&vdd_lens>;
        };
    };
